    Q 320 850 332 822
    C 350 792 358 757 358 720
    L 316 720
    A 140 140 0 0 1 176 580
    L 176 348
    A 140 140 0 0 1 316 208
    Z
    M 425 316
    L 483 316 L 483 378 L 541 378 L 541 316
    L 599 316 L 599 378 L 661 378 L 661 436
    L 599 436 L 599 494 L 661 494 L 661 552
    L 599 552 L 599 614 L 541 614 L 541 552
    L 483 552 L 483 614 L 425 614 L 425 552
    L 363 552 L 363 494 L 425 494 L 425 436
