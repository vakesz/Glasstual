<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- One silhouette: a speech bubble with the channel hash knocked out of it.
       The hash is traced as a single union outline rather than four crossing
       bars, because even-odd fills in the places where crossing bars overlap.
       Its enclosed centre square is a third subpath, nested one level deeper,
       so even-odd paints that back in.

       Geometry: bubble body 176,208 to 848,720. The hash is 298 square,
       centred on the body, with a 58pt stroke and a true 58pt square at its
       centre so it reads as a hash rather than a grid. -->
