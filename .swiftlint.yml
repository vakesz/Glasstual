excluded:
  - .agents
  - DerivedData
  - build

reporter: xcode

# TODO(swift-rewrite): Re-enable these rules as their affected Swift modules are
# rewritten. They currently describe broad pre-rewrite structure, not new defects.
disabled_rules:
  - static_over_final_class
  - trailing_comma
  - opening_brace
  - identifier_name
  - function_body_length
  - force_cast
  - cyclomatic_complexity
  - file_length
  - type_body_length
  - function_parameter_count
  - line_length
  - inclusive_language
  - block_based_kvo
  - unused_setter_value
  - closure_parameter_position
  - type_name
  - notification_center_detachment
