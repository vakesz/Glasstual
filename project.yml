# Glasstual project specification for XcodeGen.
#
# Single source of truth for targets, schemes, build settings, generated
# Info.plist files, signing, capabilities, and entitlements. Declare those
# values here rather than editing the generated files. Regenerate with:
#
#   xcodegen generate --spec project.yml
#
# Do not edit Glasstual.xcodeproj by hand.

name: Glasstual

options:
  bundleIdPrefix: com.vakesz
  deploymentTarget:
    macOS: "26.0"
  # The Xcode that CI and the release workflow build with. XcodeGen writes it
  # as the project's last upgrade check, so Xcode 27 does not offer to update
  # the settings. The deployment target above stays macOS 26.
  xcodeVersion: "27.0"
  minimumXcodeGenVersion: "2.46.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug
  transitivelyLinkDependencies: false
  groupOrdering:
    - order: [Sources, Tests]

configs:
  Debug: debug
  Release: release

settings:
  base:
    # ---- Product identity -------------------------------------------------
    GLASSTUAL_BUNDLE_IDENTIFIER: com.vakesz.glasstual
    GLASSTUAL_GROUP_CONTAINER_IDENTIFIER: group.$(DEVELOPMENT_TEAM).$(GLASSTUAL_BUNDLE_IDENTIFIER)
    MARKETING_VERSION: "1.2.0"
    # CFBundleVersion is what LaunchServices and updaters compare, so it has to
    # move every release. The release workflow overrides MARKETING_VERSION on
    # the xcodebuild line and refuses to run for a tag that already exists, so
    # deriving the build version from it makes every release distinct without
    # the workflow having to pass a second value.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)

    # ---- Signing ----------------------------------------------------------
    # Local builds sign automatically with Apple Development. CI overrides the
    # identity, style, team and GLASSTUAL_*_PROVISIONING_PROFILE on the
    # xcodebuild line: the Quality workflow for its Debug build and tests, and
    # the Signed Release workflow for its archive.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: H8W5DK3FN2
    PROVISIONING_PROFILE_SPECIFIER: ""
    GLASSTUAL_MAIN_PROVISIONING_PROFILE: ""
    GLASSTUAL_IRC_PROVISIONING_PROFILE: ""

    # ---- Platform ---------------------------------------------------------
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Releases support Apple Silicon only. Keep this explicit rather than
    # accepting Xcode's recommendation to build a universal product.
    ARCHS: arm64

    # ---- Swift ------------------------------------------------------------
    # Every target is Swift, and nothing generated is C or Objective-C, so the
    # clang warning, analyzer and preprocessor settings have nothing to act
    # on and are not declared here. XcodeGen's base presets still write
    # Xcode's template defaults for them into the generated project.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_ENABLE_EXPLICIT_MODULES: YES
    SWIFT_ENFORCE_EXCLUSIVE_ACCESS: full
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_INSTALL_OBJC_HEADER: NO
    SWIFT_EMIT_LOC_STRINGS: YES

    # ---- Build behaviour --------------------------------------------------
    ALWAYS_SEARCH_USER_PATHS: NO
    APPLY_RULES_IN_COPY_FILES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_GENERATE_DEBUGGING_SYMBOLS: YES
    GENERATE_INFOPLIST_FILE: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    REMOVE_HEADERS_FROM_EMBEDDED_BUNDLES: YES
    EXTRACT_APP_INTENTS_METADATA: NO
    # Xcode 27 otherwise schedules the App Intents tool for every target even
    # though none links AppIntents, producing one false warning per target.
    LM_SKIP_METADATA_EXTRACTION: YES
    ENABLE_DEBUG_DYLIB: NO
    LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks @executable_path/../Frameworks"
    ENABLE_HARDENED_RUNTIME: YES

  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
      DEPLOYMENT_POSTPROCESSING: NO
      ENABLE_TESTABILITY: YES
      VALIDATE_PRODUCT: NO
      # Hardened runtime blocks attaching the debugger to XPC services.
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEPLOYMENT_POSTPROCESSING: YES
      ENABLE_TESTABILITY: NO
      VALIDATE_PRODUCT: YES
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

fileGroups:
  - project.yml
  - Makefile
  - README.md

# ---------------------------------------------------------------------------
# Reusable fragments
# ---------------------------------------------------------------------------

targetTemplates:
  # Shared platform and generated version metadata.
  GlasstualTarget:
    platform: macOS
    info:
      path: Generated/Xcode/${target_name}-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

  # Shared metadata for loadable and test bundles.
  GlasstualBundle:
    templates: [GlasstualTarget]
    info:
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL

  # Plugins bundled in Glasstual.app/Contents/Resources/Bundled Extensions.
  # A plugin links only against GlasstualPluginKit and CocoaExtensions; it
  # resolves nothing from the host binary, so it links with the default
  # undefined-symbol checking rather than -undefined dynamic_lookup.
  GlasstualExtension:
    templates: [GlasstualBundle]
    type: bundle
    info:
      properties:
        MinimumGlasstualVersion: 8.0.0
        GlasstualPluginInterfaceVersion: 1
    settings:
      base:
        # Plugins are UI/app-state code loaded into the app; main actor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # X.bundle/Contents/MacOS -> Contents/MacOS -> X.bundle -> Bundled
        # Extensions -> Resources -> Contents, which holds Frameworks.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../../../Frameworks"
    # Every bundled plugin links the two frameworks that define the ABI it is
    # written against. The app embeds both, so a plugin never carries a copy.
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false

  # Services in Glasstual.app/Contents/XPCServices.
  GlasstualXPCService:
    templates: [GlasstualTarget]
    type: xpc-service
    info:
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
    entitlements:
      path: Generated/Xcode/${target_name}.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../../Frameworks"
    dependencies:
      - target: CocoaExtensions
        embed: false

  # Dynamic frameworks embedded by the application or an XPC service.
  GlasstualFramework:
    templates: [GlasstualTarget]
    type: framework
    info:
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: FMWK
    settings:
      base:
        # Swift emits .swiftmodule files directly; these frameworks have no
        # umbrella header, so do not ask Clang to synthesize a module map.
        # XcodeGen's framework preset turns this on, so it needs an override.
        DEFINES_MODULE: NO
        # The framework preset also pins CURRENT_PROJECT_VERSION to 1, which
        # would put CFBundleVersion 1 in an embedded framework while every
        # other product carries the release version; the release check
        # requires them to agree.
        CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
        # Embedded frameworks are signed by the host's CodeSignOnCopy phase.
        CODE_SIGN_IDENTITY: ""
        FRAMEWORK_VERSION: A
        INSTALL_PATH: "@rpath"
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks"

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------

targets:
  # ---- Frameworks ---------------------------------------------------------

  CocoaExtensions:
    templates: [GlasstualFramework]
    productName: CocoaExtensions
    settings:
      base:
        PRODUCT_NAME: CocoaExtensions
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.frameworks.CocoaExtensions
    info:
      properties:
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2015 - 2020 Codeux Software, LLC and respective contributors.
    sources:
      - path: Sources/Frameworks/Cocoa Extensions/Classes
      - path: Sources/Frameworks/Cocoa Extensions/Resources/Language Files
        excludes:
          # Notes for whoever edits the catalogues; not a shipped resource.
          - LocalizationCatalogNotices.md
      - path: Sources/Frameworks/Cocoa Extensions/LICENSE.txt
        buildPhase: resources
      - path: Sources/Frameworks/Cocoa Extensions/ACKNOWLEDGEMENT.txt
        buildPhase: resources
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: Security.framework

  GlasstualPluginKit:
    templates: [GlasstualFramework]
    productName: GlasstualPluginKit
    settings:
      base:
        PRODUCT_NAME: GlasstualPluginKit
        PRODUCT_MODULE_NAME: GlasstualPluginKit
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.frameworks.plugin-kit
    info:
      properties:
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2010 - 2026 Codeux Software, LLC and respective contributors.
    sources:
      - path: Sources/Frameworks/Plugin Kit
    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework

  # ---- XPC service --------------------------------------------------------

  IRCConnectionHost:
    templates: [GlasstualXPCService]
    productName: IRC Connection Host
    settings:
      base:
        PRODUCT_NAME: IRC Connection Host
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.IRCConnectionHost
        # Empty unless CI names a profile, so both configurations sign the
        # same way wherever they are built.
        PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_IRC_PROVISIONING_PROFILE)
    info:
      properties:
        CFBundleDisplayName: IRC Connection Host
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2017 - 2020 Codeux Software, LLC and respective contributors.
    entitlements:
      properties:
        # A group of the service's own, and only that: the client-side
        # certificate is looked up by the persistent reference the app hands
        # over, which needs the keychain but none of the app's groups. The
        # app's secrets are in groups this service is deliberately not given.
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(GLASSTUAL_BUNDLE_IDENTIFIER).connection-host"
        com.apple.security.network.client: true
    sources:
      - path: Sources/Services/IRC Connection Host/Classes
      - path: Sources/Services/IRC Connection Host/Resources/Language Files
        excludes:
          # Notes for whoever edits the catalogues; not a shipped resource.
          - LocalizationCatalogNotices.md
      - path: Sources/Services/IRC Connection Host/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Shared/IRC/IRCConnectionConfig.swift
      - path: Sources/Shared/IRC/ConnectionErrorCode.swift
      - path: Sources/Shared/Services/RemoteConnectionProtocols.swift
      - path: Sources/Shared/Services/SecureConnectionInformation.swift
      - path: Sources/Shared/Preferences/AppSleepPreference.swift
    dependencies:
      - sdk: Security.framework
      - sdk: SecurityInterface.framework
      - sdk: SystemConfiguration.framework

  # ---- Bundled extensions -------------------------------------------------

  Caffeine:
    templates: [GlasstualExtension]
    productName: Caffeine
    settings:
      base:
        PRODUCT_NAME: Caffeine
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.caffeine
    info:
      properties:
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2015 - 2020 Codeux Software, LLC and respective contributors.
        NSPrincipalClass: TPI_Caffeine
    sources:
      - path: Sources/Plugins/Caffeine/Classes
      - path: Sources/Plugins/Shared/FirstPartyPluginPreferences.swift
      - path: Sources/Plugins/Shared/PluginDefaultsObservation.swift
      - path: Sources/Plugins/Caffeine/Resources

  ChatFilter:
    templates: [GlasstualExtension]
    productName: Chat Filters
    settings:
      base:
        PRODUCT_NAME: Chat Filters
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.chat-filter
    info:
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2015 - 2020 Codeux Software, LLC and respective contributors.
        NSPrincipalClass: TPI_ChatFilterExtension
    sources:
      - path: Sources/Plugins/Chat Filter/Classes
      - path: Sources/Plugins/Shared/FirstPartyPluginPreferences.swift
      - path: Sources/Plugins/Shared/PluginDefaultsObservation.swift
      - path: Sources/Plugins/Chat Filter/Resources

  SmileyConverter:
    templates: [GlasstualExtension]
    productName: Smiley Converter
    settings:
      base:
        PRODUCT_NAME: Smiley Converter
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.smiley-converter
    info:
      properties:
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2013 - 2020 Codeux Software, LLC and respective contributors.
        NSPrincipalClass: TPISmileyConverter
    sources:
      - path: Sources/Plugins/Smiley Converter/Classes
      - path: Sources/Plugins/Shared/FirstPartyPluginPreferences.swift
      - path: Sources/Plugins/Shared/PluginDefaultsObservation.swift
      - path: Sources/Plugins/Smiley Converter/Resources

  SystemProfiler:
    templates: [GlasstualExtension]
    productName: System Info
    settings:
      base:
        PRODUCT_NAME: System Info
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.system-profiler
    info:
      properties:
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2012 - 2020 Codeux Software, LLC and respective contributors.
        NSPrincipalClass: TPISystemProfiler
    sources:
      - path: Sources/Plugins/System Profiler/Classes
      - path: Sources/Plugins/Shared/FirstPartyPluginPreferences.swift
      - path: Sources/Plugins/System Profiler/Resources
    dependencies:
      - sdk: Metal.framework

  UserInsights:
    templates: [GlasstualExtension]
    productName: User Insights
    settings:
      base:
        PRODUCT_NAME: User Insights
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.user-insights
    info:
      properties:
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2013 - 2018 Codeux Software, LLC and respective contributors.
        NSPrincipalClass: TPIUserInsights
    sources:
      - path: Sources/Plugins/User Insights/Classes
      - path: Sources/Plugins/User Insights/Resources

  ZNCAdditions:
    templates: [GlasstualExtension]
    productName: ZNC Additions
    settings:
      base:
        PRODUCT_NAME: ZNC Additions
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.znc-additions
    info:
      properties:
        NSHumanReadableCopyright: Part of Glasstual, an independent fork of Textual. Copyright © 2011 - 2018 Codeux Software, LLC and respective contributors.
        NSPrincipalClass: TPI_ZNCAdditions
    sources:
      - path: Sources/Plugins/ZNC Additions/Classes
      - path: Sources/Plugins/ZNC Additions/Resources
    dependencies:
      - sdk: Security.framework
      - sdk: SecurityInterface.framework

  # ---- Application --------------------------------------------------------

  Glasstual:
    templates: [GlasstualTarget]
    type: application
    productName: Glasstual
    settings:
      base:
        # The app is AppKit UI and app state; main actor by default. Helpers,
        # parsers and value types opt out with an explicit `nonisolated`.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        REGISTER_APP_GROUPS: YES
        PRODUCT_NAME: Glasstual
        PRODUCT_BUNDLE_IDENTIFIER: $(GLASSTUAL_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: Glasstual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty unless CI names a profile, so both configurations sign the
        # same way wherever they are built.
        PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_MAIN_PROVISIONING_PROFILE)
    info:
      properties:
        CFBundleDisplayName: Glasstual
        CFBundleDocumentTypes:
          # No icon file ships for either type, and an undeclared icon leaves
          # the Finder drawing a blank page. CFBundleTypeIconSystemGenerated
          # asks Launch Services to badge the application icon instead, which
          # is what a document type without art of its own should do.
          - CFBundleTypeName: Glasstual IRC Client Script
            CFBundleTypeRole: Viewer
            CFBundleTypeIconSystemGenerated: 1
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.applescript.script
          # com.apple.bundle claimed every .bundle, .app and .framework on the
          # system. The importer only ever accepts a `.bundle` directory, so
          # declare that narrower type and claim it instead.
          - CFBundleTypeName: Glasstual IRC Client Extension
            CFBundleTypeRole: Viewer
            CFBundleTypeIconSystemGenerated: 1
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.vakesz.glasstual.extension
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconName: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleURLTypes:
          # Two types, because they are two things: the system's chooser lists
          # the name beside the scheme, and "Internet Relay Chat" was a poor
          # label for glasstual:// links that open a folder or a settings pane.
          - CFBundleTypeRole: Viewer
            CFBundleURLName: Internet Relay Chat
            CFBundleURLSchemes:
              - irc
              - ircs
          - CFBundleTypeRole: Viewer
            CFBundleURLName: Glasstual Application Link
            CFBundleURLSchemes:
              - glasstual
              # ApplicationLink still answers the name the app was forked from.
              - textual
        GlasstualApplicationGroupIdentifier: $(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # No NSAppTransportSecurity exception: the transcript is native, there
        # is no web content to relax ATS for, and the exception that was here
        # relaxed nothing the native URLSession image loader uses anyway.
        NSAppleEventsUsageDescription: $(PRODUCT_NAME) runs user scripts that can control other applications.
        NSHumanReadableCopyright: Glasstual is an independent fork of Textual, continuing it on macOS 26 and later. Copyright © 2010 - 2026 Codeux Software, LLC and respective contributors.
        NSPrincipalClass: TXApplication
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.vakesz.glasstual.extension
            UTTypeDescription: Glasstual IRC Client Extension
            UTTypeConformsTo:
              - com.apple.bundle
            UTTypeTagSpecification:
              public.filename-extension:
                - bundle
    # Debug and Release use the same sandbox. In Release the hardened runtime
    # keeps library validation on, and no entitlement turns it off, so only
    # Apple-signed or same-Team-ID bundles load.
    entitlements:
      path: Generated/Xcode/Glasstual.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)"
        com.apple.security.automation.apple-events: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        # KeychainStore writes every secret to the first group, which no other
        # target lists. The second is where builds before it stored secrets;
        # they are moved into the first as they are read, so it stays for as
        # long as a user may still have items there.
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER).secrets"
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.print: true
    sources:
      - path: Sources/App/Application
      - path: Sources/App/Features
      - path: Sources/App/Localization
      - path: Sources/App/Preferences
      - path: Sources/App/Protocol
      - path: Sources/App/UI
      - path: Sources/Shared
      # The bundled plugins and the app agree on these names and defaults, so
      # the declarations live with the plugins and the app compiles them too.
      # Sources/Shared holds the app-side preference store and the declarations
      # the connection host shares; only the files the IRCConnectionHost target
      # lists actually cross that process boundary.
      - path: Sources/Plugins/Shared/FirstPartyPluginPreferences.swift
      # Resources -----------------------------------------------------------
      - path: Sources/App/Resources/Images/Application/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Sources/App/Resources/Language Files
        excludes:
          # Notes for whoever edits the catalogues; not a shipped resource.
          - LocalizationCatalogNotices.md
      - path: Sources/App/Resources/Property Lists
      - path: Sources/App/Resources/Scripting/Script Files/Bundled Scripts
        type: folder
      - path: Sources/App/Resources/User Interface
      - path: Sources/App/Resources/Documentation
        type: folder
        buildPhase: resources

    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: Cocoa.framework
      - sdk: CoreData.framework
      - sdk: CoreServices.framework
      - sdk: IOKit.framework
      - sdk: Network.framework
      - sdk: QuartzCore.framework
      - sdk: QuickLookUI.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UserNotifications.framework
      - target: CocoaExtensions
        embed: true
        codeSign: true
      - target: GlasstualPluginKit
        embed: true
        codeSign: true
      - target: IRCConnectionHost
        embed: true
        codeSign: true
      - target: Caffeine
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: ChatFilter
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: SmileyConverter
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: SystemProfiler
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: UserInsights
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: ZNCAdditions
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions

  # ---- Tests --------------------------------------------------------------

  # Unit tests run inside Glasstual.app so that they can use the app's
  # classes directly. Network fixtures use loopback listeners.
  GlasstualTests:
    templates: [GlasstualBundle]
    type: bundle.unit-test
    productName: GlasstualTests
    settings:
      base:
        # Matches the app: the bundle is loaded into the host process and most
        # of what it exercises is main-actor. A suite that tests a nonisolated
        # type says so, the same way the app's own value types do.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        PRODUCT_NAME: GlasstualTests
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.tests
    info:
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
    # No entitlements: a unit-test bundle is loaded into the host process and
    # runs under the host's sandbox. A sandbox/inherit pair on its own
    # signature is never consulted.
    sources:
      - path: Tests/GlasstualTests
      - path: Sources/Plugins/Chat Filter/Classes/ChatFilter.swift
      - path: Sources/Plugins/Chat Filter/Classes/ChatFilterEngine.swift
      - path: Sources/Plugins/Chat Filter/Classes/ChatFilterStore.swift
      - path: Sources/Plugins/Chat Filter/Resources/Language Files/ChatFilter.xcstrings
        buildPhase: resources
      - path: Sources/Plugins/Chat Filter/Resources/Language Files/ChatFilterLogic.xcstrings
        buildPhase: resources
      # Specification corpora the IRCSpec suites read back at runtime. Only
      # the JSON vectors ship. The upstream LICENSE stays beside them in the
      # source tree, as Tests/Corpora/IRCSpec/README.md describes.
      - path: Tests/Corpora/IRCSpec/parser-tests
        buildPhase: resources
        includes:
          - "*.json"
      # A throwaway self-signed identity for the loopback TLS listener the
      # trust-gate test drives the connection service against. See the README
      # beside it, which is not a shipped resource.
      - path: Tests/Corpora/TLS
        buildPhase: resources
        includes:
          - "*.p12"
    dependencies:
      - target: Glasstual
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false

  # Public AX/NSWorkspace driver and scripted loopback peer, outside the app sandbox.
  GlasstualE2EHarness:
    templates: [GlasstualTarget]
    type: tool
    info:
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
    sources:
      - path: Tests/E2EHarness
    settings:
      base:
        PRODUCT_NAME: GlasstualE2EHarness
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.e2e-harness
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: CryptoKit.framework
      - sdk: Network.framework
      - sdk: Security.framework

  # A Swift Testing bundle loaded by the test runner, not Glasstual.app.
  GlasstualE2ETests:
    templates: [GlasstualBundle]
    type: bundle.unit-test
    sources:
      - path: Tests/GlasstualE2ETests
    settings:
      base:
        PRODUCT_NAME: GlasstualE2ETests
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.e2e-tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        ENABLE_APP_SANDBOX: NO

# ---------------------------------------------------------------------------
# Schemes
# ---------------------------------------------------------------------------

schemes:
  GlasstualE2E:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Glasstual: [build, testing]
        GlasstualE2EHarness: [build, testing]
        GlasstualE2ETests: [testing]
    test:
      config: Debug
      gatherCoverageData: false
      # Every value here is stable across runs, so the supervisor can pass them as
      # build settings without changing the build description. The per-run
      # directory is read from $E2E_OUTPUT/current-run instead.
      environmentVariables:
        E2E_APP: $(E2E_APP)
        E2E_HELPER: $(E2E_HELPER)
        E2E_FIXTURE: $(E2E_FIXTURE)
        E2E_OUTPUT: $(E2E_OUTPUT)
        E2E_DISPOSABLE_USER_CONSENT: $(E2E_DISPOSABLE_USER_CONSENT)
      targets:
        - name: GlasstualE2ETests
          parallelizable: false
          randomExecutionOrder: false

  Glasstual:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Glasstual: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # The tests run inside a full launch of Glasstual.app (TEST_HOST). The
      # suite moves preferences to a scratch defaults domain. The review
      # directory moves the group container and Application Support, which
      # hold the scrollback database, caches, scripts and extensions, into
      # "UI Reviews/GlasstualTests". The pre-action empties both before every
      # run, from Xcode or from `make test`. Keep its arguments equal to the
      # two values below.
      environmentVariables:
        - variable: GLASSTUAL_UI_REVIEW_SUITE
          value: com.vakesz.glasstual.tests
          isEnabled: true
        - variable: GLASSTUAL_UI_REVIEW_DIRECTORY
          value: GlasstualTests
          isEnabled: true
      preActions:
        - name: Clear test scratch state
          settingsTarget: Glasstual
          script: |
            "${SRCROOT}/scripts/clear-test-scratch.sh" com.vakesz.glasstual.tests GlasstualTests
      targets:
        - GlasstualTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
