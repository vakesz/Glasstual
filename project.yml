# Glasstual project specification for XcodeGen.
#
# Single source of truth for targets, schemes, build settings, generated
# Info.plist files, signing, capabilities, and entitlements. Declare those
# values here rather than editing the generated files. Regenerate with:
#
#   xcodegen generate --spec project.yml
#
# Do not edit Glasstual.xcodeproj by hand.

name: Glasstual

options:
  bundleIdPrefix: com.vakesz
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.46.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug
  transitivelyLinkDependencies: false
  groupOrdering:
    - order: [Sources, Tests]

configs:
  Debug: debug
  Release: release

settings:
  base:
    # ---- Product identity -------------------------------------------------
    GLASSTUAL_BUNDLE_IDENTIFIER: com.vakesz.glasstual
    GLASSTUAL_GROUP_CONTAINER_IDENTIFIER: group.$(DEVELOPMENT_TEAM).$(GLASSTUAL_BUNDLE_IDENTIFIER)
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "260823.16"

    # ---- Signing ----------------------------------------------------------
    # Local Automatic / Apple Development. CI overrides identity, style,
    # team, and GLASSTUAL_*_PROVISIONING_PROFILE on the xcodebuild line
    # (see .github/workflows/release.yml).
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: H8W5DK3FN2
    PROVISIONING_PROFILE_SPECIFIER: ""
    GLASSTUAL_MAIN_PROVISIONING_PROFILE: ""
    GLASSTUAL_IRC_PROVISIONING_PROFILE: ""
    GLASSTUAL_SCROLLBACK_PROVISIONING_PROFILE: ""
    GLASSTUAL_INLINE_CONTENT_PROVISIONING_PROFILE: ""

    # ---- Platform ---------------------------------------------------------
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Releases support Apple Silicon only. Keep this explicit rather than
    # accepting Xcode's recommendation to build a universal product.
    ARCHS: arm64

    # ---- Languages --------------------------------------------------------
    CLANG_ENABLE_MODULES: YES
    GCC_NO_COMMON_BLOCKS: YES
    DEFINES_MODULE: YES

    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_INSTALL_OBJC_HEADER: NO
    SWIFT_EMIT_LOC_STRINGS: YES

    # ---- Warnings ---------------------------------------------------------
    WARNING_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Winfinite-recursion
    CLANG_WARN_ASSIGN_ENUM: YES
    CLANG_WARN_ATOMIC_IMPLICIT_SEQ_CST: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_IMPLICIT_FALLTHROUGH: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_SEMICOLON_BEFORE_METHOD_BODY: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: YES
    GCC_WARN_ABOUT_MISSING_NEWLINE: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    GCC_WARN_TYPECHECK_CALLS_TO_PRINTF: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_LABEL: YES
    GCC_WARN_UNUSED_VARIABLE: YES

    # ---- Static analyzer --------------------------------------------------
    CLANG_ANALYZER_GCD_PERFORMANCE: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_STATIC_ANALYZER_MODE: deep
    CLANG_USE_OPTIMIZATION_PROFILE: NO

    # ---- Build behaviour --------------------------------------------------
    ALWAYS_SEARCH_USER_PATHS: NO
    APPLY_RULES_IN_COPY_FILES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_MODULE_VERIFIER: YES
    MODULE_VERIFIER_SUPPORTED_LANGUAGES: "objective-c objective-c++"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_GENERATE_DEBUGGING_SYMBOLS: YES
    GENERATE_INFOPLIST_FILE: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    REMOVE_HEADERS_FROM_EMBEDDED_BUNDLES: YES
    EXTRACT_APP_INTENTS_METADATA: NO
    ENABLE_DEBUG_DYLIB: NO
    LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks @executable_path/../Frameworks"
    ENABLE_HARDENED_RUNTIME: YES

  configs:
    Debug:
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) DEBUG=1"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
      DEPLOYMENT_POSTPROCESSING: NO
      ENABLE_NS_ASSERTIONS: YES
      ENABLE_TESTABILITY: YES
      VALIDATE_PRODUCT: NO
      RUN_CLANG_STATIC_ANALYZER: NO
      # Hardened runtime blocks attaching the debugger to XPC services.
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
    Release:
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEPLOYMENT_POSTPROCESSING: YES
      ENABLE_NS_ASSERTIONS: NO
      ENABLE_TESTABILITY: NO
      VALIDATE_PRODUCT: YES
      RUN_CLANG_STATIC_ANALYZER: YES
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

fileGroups:
  - project.yml
  - Makefile
  - README.md

# ---------------------------------------------------------------------------
# Reusable fragments
# ---------------------------------------------------------------------------

targetTemplates:
  # Shared platform and generated version metadata.
  GlasstualTarget:
    platform: macOS
    info:
      path: Generated/Xcode/${target_name}-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

  # Shared metadata for loadable and test bundles.
  GlasstualBundle:
    templates: [GlasstualTarget]
    info:
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL

  # Loadable bundles that resolve symbols from their host process at runtime.
  # BUNDLE_LOADER would introduce a dependency cycle (host embeds bundle,
  # bundle links against host), so undefined symbols are looked up dynamically.
  LoadableBundle:
    templates: [GlasstualBundle]
    type: bundle
    settings:
      base:
        OTHER_LDFLAGS: -undefined dynamic_lookup

  # Plugins bundled in Glasstual.app/Contents/Resources/Bundled Extensions.
  GlasstualExtension:
    templates: [LoadableBundle]
    info:
      properties:
        MinimumGlasstualVersion: 8.0.0
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../Frameworks"
    entitlements:
      path: Generated/Xcode/Plugin-Inherited.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true

  # Services in Glasstual.app/Contents/XPCServices.
  GlasstualXPCService:
    templates: [GlasstualTarget]
    type: xpc-service
    info:
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
    entitlements:
      path: Generated/Xcode/${target_name}.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../../Frameworks"
    dependencies:
      - target: CocoaExtensions
        embed: false

  # Dynamic frameworks embedded by the application or an XPC service.
  GlasstualFramework:
    templates: [GlasstualTarget]
    type: framework
    info:
      properties:
        CFBundleDevelopmentRegion: English
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: FMWK
    settings:
      base:
        # Embedded frameworks are signed by the host's CodeSignOnCopy phase.
        CODE_SIGN_IDENTITY: ""
        FRAMEWORK_VERSION: A
        INSTALL_PATH: "@rpath"
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks"

  # Swift emits .swiftmodule files directly. These targets have no umbrella
  # headers, so do not ask Clang to synthesize or verify module maps for them.
  PureSwiftFramework:
    templates: [GlasstualFramework]
    settings:
      base:
        DEFINES_MODULE: NO
        ENABLE_MODULE_VERIFIER: NO

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------

targets:
  # ---- Frameworks ---------------------------------------------------------

  CocoaExtensions:
    templates: [PureSwiftFramework]
    productName: CocoaExtensions
    settings:
      base:
        PRODUCT_NAME: CocoaExtensions
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.frameworks.CocoaExtensions
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2015 - 2020 Codeux Software, LLC. All rights reserved.
    sources:
      - path: Sources/Frameworks/Cocoa Extensions/Classes
      - path: Sources/Frameworks/Cocoa Extensions/Resources/Language Files
      - path: Sources/Frameworks/Cocoa Extensions/LICENSE.txt
        buildPhase: resources
      - path: Sources/Frameworks/Cocoa Extensions/ACKNOWLEDGEMENT.txt
        buildPhase: resources
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: Security.framework

  Mustache:
    templates: [PureSwiftFramework]
    productName: Mustache
    settings:
      base:
        PRODUCT_NAME: Mustache
        PRODUCT_MODULE_NAME: Mustache
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.frameworks.mustache
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2024 Gwendal Roué
    sources:
      - path: Sources/Frameworks/Static Libraries/GRMustache/Sources
      - path: Sources/Frameworks/Static Libraries/Documentation/LICENSE-GRMustache-Swift.txt
        buildPhase: resources
      - path: Sources/Frameworks/Static Libraries/Documentation/LICENSE-libmustache.txt
        buildPhase: resources
    dependencies:
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework

  InlineContentKit:
    templates: [PureSwiftFramework]
    productName: InlineContentKit
    settings:
      base:
        PRODUCT_NAME: InlineContentKit
        PRODUCT_MODULE_NAME: InlineContentKit
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.frameworks.inline-content-kit
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2017, 2018 Codeux Software, LLC. All rights reserved.
    sources:
      - path: Sources/Frameworks/Inline Content Kit
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: Mustache
        embed: false
      - sdk: Foundation.framework
      - sdk: ImageIO.framework

  GlasstualPluginKit:
    templates: [PureSwiftFramework]
    productName: GlasstualPluginKit
    settings:
      base:
        PRODUCT_NAME: GlasstualPluginKit
        PRODUCT_MODULE_NAME: GlasstualPluginKit
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.frameworks.plugin-kit
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2010 - 2026 Codeux Software, LLC. All rights reserved.
    sources:
      - path: Sources/Frameworks/Plugin Kit
    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework

  # ---- XPC services -------------------------------------------------------

  HistoricLogFileManager:
    templates: [GlasstualXPCService]
    productName: Scrollback History Manager
    settings:
      base:
        REGISTER_APP_GROUPS: YES
        PRODUCT_NAME: Scrollback History Manager
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.ScrollbackHistoryManager
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_SCROLLBACK_PROVISIONING_PROFILE)
    info:
      properties:
        CFBundleDisplayName: Scrollback History Manager
        GlasstualApplicationGroupIdentifier: $(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)
        NSHumanReadableCopyright: Copyright © 2016 - 2018 Codeux Software, LLC. All rights reserved.
    entitlements:
      properties:
        com.apple.security.application-groups:
          - "$(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)"
    sources:
      - path: Sources/Services/Historic Log File Manager/Classes
      - path: Sources/Services/Historic Log File Manager/Resources
      - path: Sources/Shared/Application/ApplicationGroup.swift
      - path: Sources/Shared/Preferences/TPCPreferencesUserDefaults.swift
      - path: Sources/Shared/Services/HistoricLogProtocols.swift
      - path: Sources/Shared/Views/Channel View/TVCLogLineXPC.swift
    dependencies:
      - sdk: CoreData.framework

  InlineContentLoader:
    templates: [GlasstualXPCService]
    productName: Inline Content Loader
    settings:
      base:
        REGISTER_APP_GROUPS: YES
        PRODUCT_NAME: Inline Content Loader
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.InlineContentLoader
        # The Core Media plugin resolves symbols from this binary at runtime.
        DEAD_CODE_STRIPPING: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        STRIP_STYLE: non-global
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_INLINE_CONTENT_PROVISIONING_PROFILE)
    info:
      properties:
        CFBundleDisplayName: Inline Content Loader
        GlasstualApplicationGroupIdentifier: $(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)
        NSHumanReadableCopyright: Copyright © 2017, 2018 Codeux Software, LLC. All rights reserved.
    entitlements:
      properties:
        com.apple.security.application-groups:
          - "$(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)"
        com.apple.security.network.client: true
    sources:
      - path: Sources/Services/Inline Content Loader/Classes
      - path: Sources/Services/Inline Content Loader/Resources/Modules
        excludes:
          # Loaded from the bundle root, not from Components (see InlineImageModule.swift).
          - InlineImageLiveResize.js
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Components
      - path: Sources/Services/Inline Content Loader/Resources/Modules/InlineImageLiveResize.js
        buildPhase: resources
      - path: Sources/Shared/Application/ApplicationGroup.swift
      - path: Sources/Shared/Preferences/TPCPreferences.swift
      - path: Sources/Shared/Preferences/TPCPreferencesUserDefaults.swift
      - path: Sources/Shared/Services/InlineContentProtocols.swift
    dependencies:
      - sdk: ImageIO.framework
      - target: Mustache
        embed: false
      - target: InlineContentLoaderCoreMedia
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Extensions
      - target: InlineContentKit
        embed: true
        codeSign: true

  InlineContentLoaderCoreMedia:
    templates: [LoadableBundle]
    productName: Core Media
    settings:
      base:
        PRODUCT_NAME: Core Media
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.InlineContentLoader.CoreMedia
        WRAPPER_EXTENSION: mediaPlugin
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../../../../../Frameworks"
        PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        NSHumanReadableCopyright: Copyright © 2017, 2018 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: ICPCoreMedia
    entitlements:
      path: Generated/Xcode/InlineContentLoaderCoreMedia.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true
    sources:
      - path: Sources/Services/Inline Content Loader/Extensions/Core Media/Classes
      - path: Sources/Services/Inline Content Loader/Extensions/Core Media/Resources/Modules
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: Mustache
        embed: false
      - target: InlineContentKit
        embed: false

  IRCRemoteConnectionManager:
    templates: [GlasstualXPCService]
    productName: IRC Connection Host
    settings:
      base:
        PRODUCT_NAME: IRC Connection Host
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.IRCConnectionHost
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_IRC_PROVISIONING_PROFILE)
    info:
      properties:
        CFBundleDisplayName: IRC Connection Host
        NSHumanReadableCopyright: Copyright © 2017 - 2020 Codeux Software, LLC. All rights reserved.
    entitlements:
      properties:
        # The client-side certificate is stored by the app under its own access
        # group; without this the service's SecItemCopyMatching cannot see it.
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(GLASSTUAL_BUNDLE_IDENTIFIER)"
        com.apple.security.network.client: true
    sources:
      - path: Sources/Services/IRC Remote Connection Manager/Classes
      - path: Sources/Services/IRC Remote Connection Manager/Resources/Language Files
      - path: Sources/Shared/IRC/IRCConnectionConfig.swift
      - path: Sources/Shared/IRC/IRCConnectionErrors.swift
      - path: Sources/Shared/Library/TLOTimer.swift
      - path: Sources/Shared/Services/RemoteConnectionProtocols.swift
    dependencies:
      - sdk: Security.framework
      - sdk: SecurityInterface.framework
      - sdk: SystemConfiguration.framework

  # ---- Bundled extensions -------------------------------------------------

  Caffeine:
    templates: [GlasstualExtension]
    productName: Caffeine
    settings:
      base:
        PRODUCT_NAME: Caffeine
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.caffeine
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2015 - 2020 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: TPI_Caffeine
    sources:
      - path: Sources/Plugins/Caffeine/Classes
      - path: Sources/Plugins/Caffeine/Resources
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false

  ChatFilter:
    templates: [GlasstualExtension]
    productName: Chat Filters
    settings:
      base:
        PRODUCT_NAME: Chat Filters
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.chat-filter
    info:
      properties:
        CFBundleDevelopmentRegion: English
        NSHumanReadableCopyright: Copyright © 2015 - 2020 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: TPI_ChatFilterExtension
    sources:
      - path: Sources/Plugins/Chat Filter/Classes
      - path: Sources/Plugins/Chat Filter/Resources
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false

  SmileyConverter:
    templates: [GlasstualExtension]
    productName: Smiley Converter
    settings:
      base:
        PRODUCT_NAME: Smiley Converter
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.smiley-converter
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2013 - 2020 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: TPISmileyConverter
    sources:
      - path: Sources/Plugins/Smiley Converter/Classes
      - path: Sources/Plugins/Smiley Converter/Resources
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false

  SystemProfiler:
    templates: [GlasstualExtension]
    productName: System Info
    settings:
      base:
        PRODUCT_NAME: System Info
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.system-profiler
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2012 - 2020 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: TPISystemProfiler
    sources:
      - path: Sources/Plugins/System Profiler/Classes
      - path: Sources/Plugins/System Profiler/Resources
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false
      - sdk: Metal.framework

  UserInsights:
    templates: [GlasstualExtension]
    productName: User Insights
    settings:
      base:
        PRODUCT_NAME: User Insights
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.user-insights
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2013 - 2018 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: TPIUserInsights
    sources:
      - path: Sources/Plugins/User Insights/Classes
      - path: Sources/Plugins/User Insights/Resources
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false
      - sdk: CoreFoundation.framework

  ZNCAdditions:
    templates: [GlasstualExtension]
    productName: ZNC Additions
    settings:
      base:
        PRODUCT_NAME: ZNC Additions
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.znc-additions
    info:
      properties:
        NSHumanReadableCopyright: Copyright © 2011 - 2018 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: TPI_ZNCAdditions
    sources:
      - path: Sources/Plugins/ZNC Additions/Classes
      - path: Sources/Plugins/ZNC Additions/Resources
    dependencies:
      - target: CocoaExtensions
        embed: false
      - target: GlasstualPluginKit
        embed: false
      - sdk: Security.framework
      - sdk: SecurityInterface.framework

  # ---- Application --------------------------------------------------------

  Glasstual:
    templates: [GlasstualTarget]
    type: application
    productName: Glasstual
    settings:
      base:
        REGISTER_APP_GROUPS: YES
        PRODUCT_NAME: Glasstual
        PRODUCT_BUNDLE_IDENTIFIER: $(GLASSTUAL_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: Glasstual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bundled extensions resolve symbols from this binary at runtime.
        DEAD_CODE_STRIPPING: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        STRIP_STYLE: non-global
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_MAIN_PROVISIONING_PROFILE)
    info:
      properties:
        CFBundleDisplayName: Glasstual
        CFBundleDocumentTypes:
          - CFBundleTypeName: Glasstual IRC Client Script
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.applescript.script
            NSDocumentClass: TPCResourceManagerDocumentTypeImporter
          - CFBundleTypeName: Glasstual IRC Client Extension
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.bundle
            NSDocumentClass: TPCResourceManagerDocumentTypeImporter
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconName: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: Internet Relay Chat
            CFBundleURLSchemes:
              - irc
              - ircs
              - glasstual
        GlasstualApplicationGroupIdentifier: $(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: "26.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSAppleEventsUsageDescription: $(PRODUCT_NAME) runs user scripts that can control other applications.
        NSAppleScriptEnabled: true
        NSHumanReadableCopyright: Glasstual is an independent fork of Textual, continuing it on macOS 26 and later. Copyright © 2010 - 2026 Codeux Software, LLC and respective contributors.
        NSMainNibFile: TXCMainMenu
        NSPrincipalClass: TXApplication
    # Debug and Release use the same sandbox. Library validation stays on
    # (Mac App Store): only Apple-signed or same-Team-ID bundles load.
    entitlements:
      path: Generated/Xcode/Glasstual.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)"
        com.apple.security.automation.apple-events: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.print: true
    sources:
      - path: Sources/App/Classes
      - path: Sources/App/Features
      - path: Sources/App/Modules
      - path: Sources/Shared
      # Resources -----------------------------------------------------------
      - path: Sources/App/Resources/Images
        excludes:
          - Application/AppIcon.icon
      - path: Sources/App/Resources/Images/Application/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Sources/App/Resources/Language Files
      - path: Sources/App/Resources/Property Lists
        excludes:
          - Preferences
      - path: Sources/App/Resources/Property Lists/Preferences
        type: folder
        buildPhase: resources
      - path: Sources/App/Resources/Scripting/Script Files/Bundled Scripts
        type: folder
      - path: Sources/App/Resources/Styling/Bundled Styles
        type: folder
      - path: Sources/App/Resources/Styling/JavaScript
        type: folder
      - path: Sources/App/Resources/Styling/Style Default Templates
        type: folder
      - path: Sources/App/Resources/User Interface
      - path: Sources/App/Resources/Documentation
        type: folder
        buildPhase: resources

    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: Cocoa.framework
      - sdk: CoreServices.framework
      - sdk: IOKit.framework
      - sdk: Network.framework
      - sdk: QuartzCore.framework
      - sdk: QuickLookUI.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UserNotifications.framework
      - sdk: WebKit.framework
      - target: CocoaExtensions
        embed: true
        codeSign: true
      - target: InlineContentKit
        embed: true
        codeSign: true
      - target: GlasstualPluginKit
        embed: true
        codeSign: true
      - target: Mustache
        embed: true
        codeSign: true
      - target: HistoricLogFileManager
        embed: true
        codeSign: true
      - target: InlineContentLoader
        embed: true
        codeSign: true
      - target: IRCRemoteConnectionManager
        embed: true
        codeSign: true
      - target: Caffeine
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: ChatFilter
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: SmileyConverter
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: SystemProfiler
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: UserInsights
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions
      - target: ZNCAdditions
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Bundled Extensions

  # ---- Tests --------------------------------------------------------------

  # Unit tests run inside Glasstual.app so that they can use the app's
  # classes directly. Tests never touch the network.
  GlasstualTests:
    templates: [GlasstualBundle]
    type: bundle.unit-test
    productName: GlasstualTests
    settings:
      base:
        PRODUCT_NAME: GlasstualTests
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.tests
    info:
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
    # Sandboxed hosts require the injected bundle to share the host's
    # entitlements.
    entitlements:
      path: Generated/Xcode/GlasstualTests.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true
    sources:
      - path: Tests/GlasstualTests
      # The Core Media modules ship in a loadable plugin the test host never
      # loads. Compiling them into the test bundle is the only way to cover
      # their URL matching; the plugin target keeps its own copy.
      - path: Sources/Services/Inline Content Loader/Extensions/Core Media/Classes
    dependencies:
      - target: Glasstual
      - target: CocoaExtensions
        embed: false
      - target: InlineContentKit
        embed: false
      - target: GlasstualPluginKit
        embed: false
      - target: Mustache
        embed: false

# ---------------------------------------------------------------------------
# Schemes
# ---------------------------------------------------------------------------

schemes:
  Glasstual:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Glasstual: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # Tests are injected into Glasstual.app (TEST_HOST). Point the shared
      # defaults suite at a scratch domain so runs never touch real prefs.
      environmentVariables:
        - variable: GLASSTUAL_UI_REVIEW_SUITE
          value: com.vakesz.glasstual.tests
          isEnabled: true
      targets:
        - GlasstualTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
