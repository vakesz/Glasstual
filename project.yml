      - path: Sources/Shared
      # Resources -----------------------------------------------------------
      - path: Sources/App/Resources/Images
        excludes:
          - Application/AppIcon.icon
          - DMG Canvas
      - path: Sources/App/Resources/Images/Application/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Sources/App/Resources/Language Files
