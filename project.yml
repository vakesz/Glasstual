# Glasstual project specification for XcodeGen.
#
# Single source of truth for the Xcode project: targets, schemes, build
# settings, Info.plist files, and entitlements. Regenerate after editing with:
#
#   xcodegen generate
#
# Do not edit Glasstual.xcodeproj by hand.

name: Glasstual

options:
  bundleIdPrefix: com.vakesz
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.46.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug
  transitivelyLinkDependencies: false
  groupOrdering:
    - order: [Sources, Tests, XPC Services, Frameworks]

configs:
  Debug: debug
  Release: release

settings:
  base:
    # ---- Product identity -------------------------------------------------
    GLASSTUAL_PRODUCT_NAME: Glasstual
    GLASSTUAL_BUNDLE_IDENTIFIER: com.vakesz.glasstual
    GLASSTUAL_GROUP_CONTAINER_IDENTIFIER: group.$(DEVELOPMENT_TEAM).$(GLASSTUAL_BUNDLE_IDENTIFIER)
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "260823.16"

    # ---- Signing ----------------------------------------------------------
    # Local Automatic / Apple Development. CI overrides identity, style,
    # team, and GLASSTUAL_*_PROVISIONING_PROFILE on the xcodebuild line
    # (see .github/workflows/release.yml).
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: H8W5DK3FN2
    PROVISIONING_PROFILE_SPECIFIER: ""
    GLASSTUAL_MAIN_PROVISIONING_PROFILE: ""
    GLASSTUAL_IRC_PROVISIONING_PROFILE: ""
    GLASSTUAL_SCROLLBACK_PROVISIONING_PROFILE: ""
    GLASSTUAL_INLINE_CONTENT_PROVISIONING_PROFILE: ""

    GLASSTUAL_BUILD_HEADERS_DIR: $(BUILT_PRODUCTS_DIR)/GlasstualBuildHeaders
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - '"$(GLASSTUAL_BUILD_HEADERS_DIR)"'

    # ---- Platform ---------------------------------------------------------
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    VALID_ARCHS: arm64

    # ---- Languages --------------------------------------------------------
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    GCC_ENABLE_OBJC_EXCEPTIONS: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    DEFINES_MODULE: YES

    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_INSTALL_OBJC_HEADER: NO
    SWIFT_EMIT_LOC_STRINGS: YES

    # ---- Warnings ---------------------------------------------------------
    WARNING_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wobjc-circular-container -Winfinite-recursion
    CLANG_WARN_ASSIGN_ENUM: YES
    CLANG_WARN_ATOMIC_IMPLICIT_SEQ_CST: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_IMPLICIT_FALLTHROUGH: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_SEMICOLON_BEFORE_METHOD_BODY: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: YES
    GCC_WARN_ABOUT_MISSING_NEWLINE: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    GCC_WARN_TYPECHECK_CALLS_TO_PRINTF: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_LABEL: YES
    GCC_WARN_UNUSED_VARIABLE: YES

    # ---- Static analyzer --------------------------------------------------
    CLANG_ANALYZER_GCD_PERFORMANCE: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_STATIC_ANALYZER_MODE: deep
    CLANG_USE_OPTIMIZATION_PROFILE: NO

    # ---- Build behaviour --------------------------------------------------
    ALWAYS_SEARCH_USER_PATHS: NO
    APPLY_RULES_IN_COPY_FILES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_MODULE_VERIFIER: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_GENERATE_DEBUGGING_SYMBOLS: YES
    GENERATE_INFOPLIST_FILE: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    REMOVE_HEADERS_FROM_EMBEDDED_BUNDLES: YES
    EXTRACT_APP_INTENTS_METADATA: NO
    ENABLE_DEBUG_DYLIB: NO
    LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks @executable_path/../Frameworks"
    ENABLE_HARDENED_RUNTIME: YES

  configs:
    Debug:
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) DEBUG=1"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
      DEPLOYMENT_POSTPROCESSING: NO
      ENABLE_NS_ASSERTIONS: YES
      ENABLE_TESTABILITY: YES
      VALIDATE_PRODUCT: NO
      RUN_CLANG_STATIC_ANALYZER: NO
      # Hardened runtime blocks attaching the debugger to XPC services.
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
    Release:
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEPLOYMENT_POSTPROCESSING: YES
      ENABLE_NS_ASSERTIONS: NO
      ENABLE_TESTABILITY: NO
      VALIDATE_PRODUCT: YES
      RUN_CLANG_STATIC_ANALYZER: YES
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

fileGroups:
  - README.md
  - Brewfile

# ---------------------------------------------------------------------------
# Reusable fragments
# ---------------------------------------------------------------------------

targetTemplates:
  # Shared dependency on BuildConfig.h generation. Targets add only what differs.
  GlasstualTarget:
    platform: macOS
    dependencies:
      - target: BuildConfig
        link: false
        embed: false

  # Loadable bundles that resolve symbols from their host process at runtime.
  # BUNDLE_LOADER would introduce a dependency cycle (host embeds bundle,
  # bundle links against host), so undefined symbols are looked up dynamically.
  LoadableBundle:
    templates: [GlasstualTarget]
    type: bundle
    settings:
      base:
        OTHER_LDFLAGS: -undefined dynamic_lookup
        GCC_PREFIX_HEADER: ""
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - '"$(SRCROOT)/Frameworks/Static Libraries/Libraries"'

  # Plugins bundled in Glasstual.app/Contents/Resources/Bundled Extensions.
  GlasstualExtension:
    templates: [LoadableBundle]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - "$(SRCROOT)/Sources/App/Classes/Headers/**"
          - "$(SRCROOT)/Sources/Shared/Headers/**"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../Frameworks"
    entitlements:
      path: Sources/Plugins/Inherited.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true

  # Services in Glasstual.app/Contents/XPCServices.
  GlasstualXPCService:
    templates: [GlasstualTarget]
    type: xpc-service
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - "$(SRCROOT)/Sources/Shared/Headers/**"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - '"$(SRCROOT)/Frameworks/Static Libraries/Libraries"'
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../../Frameworks"
    dependencies:
      - target: CocoaExtensions
        embed: false

  # Vendored Codeux frameworks.
  GlasstualFramework:
    templates: [GlasstualTarget]
    type: framework
    settings:
      base:
        # Embedded frameworks are signed by the host's CodeSignOnCopy phase.
        CODE_SIGN_IDENTITY: ""
        FRAMEWORK_VERSION: A
        INSTALL_PATH: "@rpath"
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks"
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------

aggregateTargets:
  # Generates BuildConfig.h from build settings into
  # $(GLASSTUAL_BUILD_HEADERS_DIR). Everything else depends on this target.
  BuildConfig:
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    buildScripts:
      - name: Generate BuildConfig.h
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/project.yml
        outputFiles:
          - $(GLASSTUAL_BUILD_HEADERS_DIR)/BuildConfig.h
        script: |
          set -euo pipefail

          : "${GLASSTUAL_BUILD_HEADERS_DIR:?must be set by XcodeGen}"
          mkdir -p "${GLASSTUAL_BUILD_HEADERS_DIR}"

          output="${GLASSTUAL_BUILD_HEADERS_DIR}/BuildConfig.h"
          candidate="${TEMP_DIR}/BuildConfig.h.tmp"

          {
            echo "/* Generated by the BuildConfig target declared in project.yml. */"
            echo
            echo "#define TXBundleBuildProductName                  @\"${GLASSTUAL_PRODUCT_NAME}\""
            echo "#define TXBundleBuildProductIdentifier            @\"${GLASSTUAL_BUNDLE_IDENTIFIER}\""
            echo "#define TXBundleBuildProductIdentifierCString      \"${GLASSTUAL_BUNDLE_IDENTIFIER}\""
            echo "#define TXBundleBuildGroupContainerIdentifier     @\"${GLASSTUAL_GROUP_CONTAINER_IDENTIFIER}\""
            echo "#define TXBundleBuildVersion                      @\"${CURRENT_PROJECT_VERSION}\""
            echo "#define TXBundleBuildVersionShort                 @\"${MARKETING_VERSION}\""
          } > "${candidate}"

          if cmp -s "${candidate}" "${output}"; then
            rm -f "${candidate}"
          else
            mv -f "${candidate}" "${output}"
            echo "Wrote ${output}"
          fi


targets:

  # ---- Frameworks ---------------------------------------------------------

  CocoaExtensions:
    templates: [GlasstualFramework]
    productName: CocoaExtensions
    settings:
      base:
        PRODUCT_NAME: CocoaExtensions
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.frameworks.CocoaExtensions
        GCC_PREFIX_HEADER: Frameworks/Cocoa Extensions/Classes/CocoaExtensions_Prefix.pch
        MODULEMAP_PRIVATE_FILE: Frameworks/Cocoa Extensions/Classes/module.private.modulemap
    info:
      path: Frameworks/Cocoa Extensions/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: English
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2015 - 2020 Codeux Software, LLC. All rights reserved.
    sources:
      - path: Frameworks/Cocoa Extensions/Classes
        excludes:
          - CocoaExtensionsPrivate.h
          - XRLoggingPrivate.h
          - CocoaExtensions_Prefix.pch
          - module.private.modulemap
        headerVisibility: public
      - path: Frameworks/Cocoa Extensions/Classes/CocoaExtensionsPrivate.h
        headerVisibility: private
      - path: Frameworks/Cocoa Extensions/Classes/XRLoggingPrivate.h
        headerVisibility: private
      - path: Frameworks/Cocoa Extensions/Classes/CocoaExtensions_Prefix.pch
        buildPhase: none
      - path: Frameworks/Cocoa Extensions/Classes/module.private.modulemap
        buildPhase: none
      - path: Frameworks/Cocoa Extensions/Resources/Language Files
      - path: Frameworks/Cocoa Extensions/LICENSE.txt
        buildPhase: resources
      - path: Frameworks/Cocoa Extensions/ACKNOWLEDGEMENT.txt
        buildPhase: resources
    dependencies:
      - sdk: Foundation.framework
      - sdk: Cocoa.framework
      - sdk: Security.framework

  # ---- XPC services -------------------------------------------------------

  HistoricLogFileManager:
    templates: [GlasstualXPCService]
    productName: Scrollback History Manager
    settings:
      base:
        REGISTER_APP_GROUPS: YES
        PRODUCT_NAME: Scrollback History Manager
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.ScrollbackHistoryManager
        GCC_PREFIX_HEADER: XPC Services/Historic Log File Manager/Classes/Headers/Private/HSLHistoricLogPCHPrivate.h
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_SCROLLBACK_PROVISIONING_PROFILE)
    info:
      path: XPC Services/Historic Log File Manager/Resources/Property Lists/Info.plist
      properties:
        CFBundleDisplayName: Scrollback History Manager
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2016 - 2018 Codeux Software, LLC. All rights reserved.
        XPCService:
          ServiceType: Application
    entitlements:
      path: XPC Services/Historic Log File Manager/HistoricLogFileManager.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)"
    sources:
      - path: XPC Services/Historic Log File Manager/Classes
      - path: XPC Services/Historic Log File Manager/Resources
        excludes: ["Property Lists/Info.plist"]
      - path: Sources/Shared/Headers
      - path: Sources/Shared/Preferences/TPCPreferencesUserDefaults.m
      - path: Sources/Shared/Views/Channel View/TVCLogLineXPC.m
    dependencies:
      - sdk: CoreData.framework

  InlineContentLoader:
    templates: [GlasstualXPCService]
    productName: Inline Content Loader
    settings:
      base:
        REGISTER_APP_GROUPS: YES
        PRODUCT_NAME: Inline Content Loader
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.InlineContentLoader
        GCC_PREFIX_HEADER: XPC Services/Inline Content Loader/Classes/Headers/Private/ICLProcessPCHPrivate.h
        # The Core Media plugin resolves symbols from this binary at runtime.
        DEAD_CODE_STRIPPING: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        STRIP_STYLE: non-global
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_INLINE_CONTENT_PROVISIONING_PROFILE)
    info:
      path: XPC Services/Inline Content Loader/Resources/Property Lists/Info.plist
      properties:
        CFBundleDisplayName: Inline Content Loader
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2017, 2018 Codeux Software, LLC. All rights reserved.
        XPCService:
          ServiceType: Application
    entitlements:
      path: XPC Services/Inline Content Loader/InlineContentLoader.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)"
        com.apple.security.network.client: true
    sources:
      - path: XPC Services/Inline Content Loader/Classes
      - path: XPC Services/Inline Content Loader/Resources/Modules
        excludes:
          # Loaded from the bundle root, not from Components (see ICMInlineImage.m).
          - InlineImageLiveResize.js
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Components
      - path: XPC Services/Inline Content Loader/Resources/Modules/InlineImageLiveResize.js
        buildPhase: resources
      - path: Sources/Shared/Headers
      - path: Sources/Shared/Preferences/TPCPreferences.m
      - path: Sources/Shared/Preferences/TPCPreferencesUserDefaults.m
    dependencies:
      - sdk: ImageIO.framework
      - framework: Frameworks/Static Libraries/Libraries/GRMustache.framework
        embed: false
      - target: InlineContentLoaderCoreMedia
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Extensions

  InlineContentLoaderCoreMedia:
    templates: [LoadableBundle]
    productName: Core Media
    settings:
      base:
        PRODUCT_NAME: Core Media
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.InlineContentLoader.CoreMedia
        WRAPPER_EXTENSION: mediaPlugin
        GCC_PREFIX_HEADER: XPC Services/Inline Content Loader/Extensions/Core Media/Classes/Headers/Private/ICPCoreMediaPCHPrivate.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - '"$(SRCROOT)/XPC Services/Inline Content Loader/Classes/Headers/**"'
          - '"$(SRCROOT)/XPC Services/Inline Content Loader/Classes/Modules/**"'
          - "$(SRCROOT)/Sources/Shared/Headers/**"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../../../../../../Frameworks"
        PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: XPC Services/Inline Content Loader/Extensions/Core Media/Resources/Property Lists/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2017, 2018 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: ICPCoreMedia
    entitlements:
      path: XPC Services/Inline Content Loader/Extensions/Core Media/CoreMedia.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true
    sources:
      - path: XPC Services/Inline Content Loader/Extensions/Core Media/Classes
      - path: XPC Services/Inline Content Loader/Extensions/Core Media/Resources/Modules
    dependencies:
      - target: CocoaExtensions
        embed: false

  IRCRemoteConnectionManager:
    templates: [GlasstualXPCService]
    productName: IRC Connection Host
    settings:
      base:
        PRODUCT_NAME: IRC Connection Host
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.IRCConnectionHost
        GCC_PREFIX_HEADER: XPC Services/IRC Remote Connection Manager/Classes/Headers/Private/RCMProcessPCHPrivate.h
        SWIFT_OBJC_BRIDGING_HEADER: XPC Services/IRC Remote Connection Manager/Classes/Headers/Private/SwiftBridgingHeaderPrivate.h
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_IRC_PROVISIONING_PROFILE)
    info:
      path: XPC Services/IRC Remote Connection Manager/Resources/Property Lists/Info.plist
      properties:
        CFBundleDisplayName: IRC Connection Host
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2017 - 2020 Codeux Software, LLC. All rights reserved.
        XPCService:
          ServiceType: Application
    entitlements:
      path: XPC Services/IRC Remote Connection Manager/IRCRemoteConnectionManager.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    sources:
      - path: XPC Services/IRC Remote Connection Manager/Classes
      - path: XPC Services/IRC Remote Connection Manager/Resources/Language Files
      - path: Sources/Shared/Headers
      - path: Sources/Shared/Helpers/Cocoa (Objective-C)/NSObjectHelper.m
      - path: Sources/Shared/IRC/IRCConnectionConfig.m
      - path: Sources/Shared/IRC/IRCConnectionErrors.m
      - path: Sources/Shared/Library/TLOLocalization.m
      - path: Sources/Shared/Library/TLOLocalization.swift
      - path: Sources/Shared/Library/TLOTimer.m
    dependencies:
      - sdk: Security.framework
      - sdk: SecurityInterface.framework
      - sdk: SystemConfiguration.framework

  # ---- Bundled extensions -------------------------------------------------

  Caffeine:
    templates: [GlasstualExtension]
    productName: Caffeine
    settings:
      base:
        PRODUCT_NAME: Caffeine
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.extensions.caffeine
    info:
      path: Sources/Plugins/Caffeine/Resources/Property Lists/Info.plist
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MinimumGlasstualVersion: 7.2.4
        NSHumanReadableCopyright: Copyright © 2015 - 2020 Codeux Software, LLC. All rights reserved.
        NSPrincipalClass: TPI_Caffeine
    sources:
      - path: Sources/Plugins/Caffeine/Classes
      - path: Sources/Plugins/Caffeine/Resources
        excludes: ["Property Lists/Info.plist"]
