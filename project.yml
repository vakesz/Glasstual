      - path: Sources/App/Modules/IRCProtocol/Connection/IRCConnection.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/IRCProtocol/DirectChat/IRCDirectChatConnection.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/IRCProtocol/Inbound/IRCMessage.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/IRCProtocol/Presence/IRCChannel.swift
        optional: true
