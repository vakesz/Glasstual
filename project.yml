  # ---- Application --------------------------------------------------------

  Glasstual:
    templates: [GlasstualTarget]
    type: application
    productName: Glasstual
    settings:
      base:
        REGISTER_APP_GROUPS: YES
        PRODUCT_NAME: Glasstual
        PRODUCT_BUNDLE_IDENTIFIER: $(GLASSTUAL_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: Glasstual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GCC_PREFIX_HEADER: Sources/App/Classes/Headers/Private/GlasstualPrivate.h
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/Classes/Headers/Private/SwiftBridgingHeaderPrivate.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - "$(SRCROOT)/Sources/App/Classes/Headers/**"
          - "$(SRCROOT)/Sources/Shared/Headers/**"
          - "$(SRCROOT)/Sources/App/Classes/Dialogs/Onboarding"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - '"$(SRCROOT)/Frameworks/Static Libraries/Libraries"'
        # Bundled extensions resolve symbols from this binary at runtime.
        DEAD_CODE_STRIPPING: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        STRIP_STYLE: non-global
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(GLASSTUAL_MAIN_PROVISIONING_PROFILE)
    info:
      path: Sources/App/Resources/Property Lists/Application Properties/Info.plist
      properties:
        CFBundleDisplayName: Glasstual
        CFBundleDocumentTypes:
          - CFBundleTypeName: Glasstual IRC Client Script
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.applescript.script
            NSDocumentClass: TPCResourceManagerDocumentTypeImporter
          - CFBundleTypeName: Glasstual IRC Client Extension
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.bundle
            NSDocumentClass: TPCResourceManagerDocumentTypeImporter
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconName: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: Internet Relay Chat
            CFBundleURLSchemes:
              - irc
              - ircs
              - glasstual
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: "26.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSAppleEventsUsageDescription: $(PRODUCT_NAME) runs user scripts that can control other applications.
        NSAppleScriptEnabled: true
        NSHumanReadableCopyright: Glasstual is an independent fork of Textual, continuing it on macOS 26 and later. Copyright © 2010 - 2026 Codeux Software, LLC and respective contributors.
        NSMainNibFile: TXCMainMenu
        NSPrincipalClass: TXApplication
    # Debug and Release use the same sandbox. Library validation stays on
    # (Mac App Store): only Apple-signed or same-Team-ID bundles load.
    entitlements:
      path: Sources/App/Glasstual.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(GLASSTUAL_GROUP_CONTAINER_IDENTIFIER)"
        com.apple.security.automation.apple-events: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.print: true
    sources:
      - path: Sources/App/Classes
      - path: Sources/App/Modules
        excludes:
          - "AppKitSupport/TDCChannelPropertiesSheet.swift"
          - "AppKitSupport/TDCFileTransferDialog.swift"
          - "AppKitSupport/TDCFileTransferDialogSocket.swift"
          - "AppKitSupport/TDCFileTransferDialogSocketConstants.m"
          - "AppKitSupport/TDCFileTransferDialogTransferController.swift"
          - "AppKitSupport/TVCAppearance.swift"
          - "AppKitSupport/TVCLogLine.swift"
          - "AppKitSupport/TVCLogLineCompatibility.m"
          - "AppKitSupport/TVCLogLineConstants.m"
          - "AppKitSupport/TVCLogView.swift"
          - "AppKitSupport/TVCLogViewConsoleShim.m"
          - "AppKitSupport/TVCLogViewConstants.m"
          - "AppKitSupport/TVCLogViewInternalWK2.swift"
          - "AppKitSupport/TVCMainWindowChannelView.swift"
          - "AppKitSupport/TVCMemberListCell.swift"
          - "AppKitSupport/TVCServerList.swift"
          - "AppKitSupport/TVCServerListCell.swift"
          - "AppKitSupport/TVCTextFormatterMenu.swift"
          - "AppKitSupport/TVCTextViewWithIRCFormatter.swift"
          - "AppKitSupport/NSStringHelper.swift"
          - "IRCProtocol/Connection/IRCConnection.swift"
          - "IRCProtocol/DirectChat/IRCDirectChatConnection.swift"
          - "IRCProtocol/Inbound/IRCMessage.swift"
          - "IRCProtocol/IRCProtocolObjCConstants.m"
          - "IRCProtocol/Presence/IRCChannel.swift"
          - "IRCProtocol/Presence/IRCChannelConfig.swift"
          - "IRCProtocol/Presence/IRCChannelMemberList.swift"
          - "IRCProtocol/Presence/IRCChannelUser.swift"
          - "IRCProtocol/Presence/IRCUser.swift"
          - "IRCProtocol/Presence/IRCWorld.swift"
          - "Plugins/**"
      - path: Sources/App/Modules/AppKitSupport/TDCChannelPropertiesSheet.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TDCFileTransferDialog.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TDCFileTransferDialogSocket.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TDCFileTransferDialogSocketConstants.m
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TDCFileTransferDialogTransferController.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCAppearance.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCLogLine.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCLogView.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCLogViewInternalWK2.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCMainWindowChannelView.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCMemberListCell.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCServerList.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCServerListCell.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCTextFormatterMenu.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/TVCTextViewWithIRCFormatter.swift
        optional: true
        buildPhase: none
      - path: Sources/App/Modules/AppKitSupport/NSStringHelper.swift
        optional: true
