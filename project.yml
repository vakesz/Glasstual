  # ---- Tests --------------------------------------------------------------

  # Unit tests run inside Glasstual.app so that they can use the app's
  # classes directly. Tests never touch the network.
  GlasstualTests:
    templates: [GlasstualTarget]
    type: bundle.unit-test
    productName: GlasstualTests
    settings:
      base:
        PRODUCT_NAME: GlasstualTests
        PRODUCT_BUNDLE_IDENTIFIER: com.vakesz.glasstual.tests
        GCC_PREFIX_HEADER: Sources/App/Classes/Headers/Private/GlasstualPrivate.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - "$(SRCROOT)/Sources/App/Classes/Headers/**"
          - "$(SRCROOT)/Sources/Shared/Headers/**"
          - "$(SRCROOT)/Sources/App/Classes/Dialogs/Onboarding"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - '"$(SRCROOT)/Frameworks/Static Libraries/Libraries"'
    info:
      path: Tests/GlasstualTests/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    # Sandboxed hosts require the injected bundle to share the host's
    # entitlements.
    entitlements:
      path: Tests/GlasstualTests/GlasstualTests.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true
    sources:
      - path: Tests/GlasstualTests
    dependencies:
      - target: Glasstual
      - target: CocoaExtensions
        embed: false

# ---------------------------------------------------------------------------
# Schemes
# ---------------------------------------------------------------------------

schemes:
  Glasstual:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Glasstual: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlasstualTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
