		9DC31B9B52E7EF21E3A4223E /* Generate BuildConfig.h */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(SRCROOT)/Scripts/GenerateBuildConfig.sh",
