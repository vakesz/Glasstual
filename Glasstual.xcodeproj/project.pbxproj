				"$(SRCROOT)/Configurations/Debug.xcconfig",
				"$(SRCROOT)/Configurations/Release.xcconfig",
			);
			name = "Generate BuildConfig.h";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(GLASSTUAL_BUILD_HEADERS_DIR)/BuildConfig.h",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "#!/bin/bash\n\n# Writes BuildConfig.h from build settings.\n#\n# Runs as the only build phase of the \"BuildConfig\" aggregate target in\n# Glasstual.xcodeproj. Every target that includes the header depends on\n# that target and has GLASSTUAL_BUILD_HEADERS_DIR on its header search path.\n# The file is only rewritten when its content changes so dependents are not\n# rebuilt needlessly. Feature flags are not written here; they reach the\n# compilers through GCC_PREPROCESSOR_DEFINITIONS and\n# SWIFT_ACTIVE_COMPILATION_CONDITIONS (see Configurations/Base.xcconfig).\n\nset -euo pipefail\n\n: \"${GLASSTUAL_BUILD_HEADERS_DIR:?must be set by Xcode (see Configurations/Base.xcconfig)}\"\n\nmkdir -p \"${GLASSTUAL_BUILD_HEADERS_DIR}\"\n\n# Scratch files go to the per-target temp dir: the user-script sandbox only\n# allows writes to declared outputs and to TEMP_DIR.\nscratch_dir=\"${TEMP_DIR:-${TMPDIR:-/tmp}}\"\n\nreplace_if_changed() {\n\tlocal candidate=\"$1\"\n\tlocal destination=\"$2\"\n\n\tif cmp -s \"${candidate}\" \"${destination}\"; then\n\t\trm -f \"${candidate}\"\n\telse\n\t\tmv -f \"${candidate}\" \"${destination}\"\n\t\techo \"Wrote ${destination}\"\n\tfi\n}\n\nheader_banner=\"/* Generated by Scripts/GenerateBuildConfig.sh. Do not edit; changes are not saved or committed. */\"\n\n# ---- BuildConfig.h --------------------------------------------------------\n\nbuild_config=\"${GLASSTUAL_BUILD_HEADERS_DIR}/BuildConfig.h\"\nbuild_config_tmp=\"${scratch_dir}/BuildConfig.h.tmp\"\n\n{\n\techo \"${header_banner}\"\n\techo\n\techo \"#define TXBundleBuildProductName                  @\\\"${GLASSTUAL_PRODUCT_NAME}\\\"\"\n\techo \"#define TXBundleBuildProductIdentifier            @\\\"${GLASSTUAL_BUNDLE_IDENTIFIER}\\\"\"\n\techo \"#define TXBundleBuildProductIdentifierCString      \\\"${GLASSTUAL_BUNDLE_IDENTIFIER}\\\"\"\n\techo \"#define TXBundleBuildGroupContainerIdentifier     @\\\"${GLASSTUAL_GROUP_CONTAINER_IDENTIFIER}\\\"\"\n\techo \"#define TXBundleBuildVersion                      @\\\"${CURRENT_PROJECT_VERSION}\\\"\"\n\techo \"#define TXBundleBuildVersionShort                 @\\\"${MARKETING_VERSION}\\\"\"\n} > \"${build_config_tmp}\"\n\nreplace_if_changed \"${build_config_tmp}\" \"${build_config}\"\n";
		};
