name: Feature request
description: Suggest an improvement or a missing IRC feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      description: If this is an IRC feature, link the RFC or IRCv3 specification.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
