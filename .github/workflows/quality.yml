name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "${XCODE_APP:-/Applications/Xcode.app}"
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -q '^Xcode 27'

      - name: Install development tools
        run: brew bundle --no-upgrade

      - name: Lint
        run: make lint

      - name: Verify the committed project matches project.yml
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- Glasstual.xcodeproj

      - name: Build (Debug, unsigned)
        run: |
          set -euo pipefail
          ./Scripts/UpdateVersion.sh
          xcodebuild \
            -project Glasstual.xcodeproj \
            -scheme Glasstual \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
