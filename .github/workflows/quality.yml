name: Quality

# Lint and format checks only. Building, testing and signing cost hosted macOS
# minutes; they run locally before a push (see AGENTS.md "Before handing off")
# and the signed build happens once, in the Signed Release workflow.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and check formatting
        run: make lint
