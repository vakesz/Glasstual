name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and check formatting
        run: make lint

      - name: Validate Xcode project generation
        run: |
          make generate
          git diff --exit-code -- Glasstual.xcodeproj

      - name: Select minimum supported Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "::error::The runner does not provide Xcode 26."
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}"
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | head -n 1 | sed -E 's/^Xcode ([0-9]+).*/\1/')"
          [ "${XCODE_MAJOR}" -eq 26 ]

      - name: Compile unsigned Release build
        run: |
          set -euo pipefail
          xcodebuild \
            -project Glasstual.xcodeproj \
            -scheme Glasstual \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
