name: Quality

# The checks AGENTS.md asks for before a hand-off. The Signed Release workflow
# accepts a commit only after a push run of this workflow passed every job.
# scripts/release-validation.sh lists the required jobs and steps by name, so
# rename a step in both places.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  # A new push to a pull request replaces its older run. A run on master always
  # finishes, because a release needs a completed run for its exact commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and check formatting
        run: make lint

  build-and-test:
    # The unit tests use the data-protection keychain and the app group, which
    # need a Team ID in the signature, so this job signs with the Developer ID
    # identity. GitHub gives no secrets to a pull request from a fork, so such
    # a pull request gets the lint job only.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODEBUILD_FLAGS: >-
        CODE_SIGN_STYLE=Manual
        CODE_SIGN_IDENTITY='Developer ID Application'
        DEVELOPMENT_TEAM=H8W5DK3FN2
        GLASSTUAL_MAIN_PROVISIONING_PROFILE='Glasstual Developer ID'
        GLASSTUAL_IRC_PROVISIONING_PROFILE='Glasstual IRC Connection Host Developer ID'
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Xcode 27 runner
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | head -n 1 | sed -E 's/^Xcode ([0-9]+).*/\1/')"
          [ "${XCODE_MAJOR}" -eq 27 ]

      - name: Generate Xcode project
        run: make generate

      # Generated/Xcode is ignored, and generate already lints it; the project
      # itself is committed and has to match project.yml exactly.
      - name: Check generated project is committed
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- Glasstual.xcodeproj)"
          if [ -n "${changes}" ]; then
            echo "::error::Glasstual.xcodeproj does not match project.yml. Run make generate and commit the result."
            printf '%s\n' "${changes}"
            git diff -- Glasstual.xcodeproj
            exit 1
          fi

      - name: Install Developer ID signing material
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: bash scripts/ci-signing.sh install

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test

      # Loopback peers and synthetic clients only. The GUI end-to-end gate
      # (make e2e) needs a disposable login and an Accessibility grant, so it
      # stays local.
      - name: Check loopback fixtures
        run: make e2e-fixtures

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            build/Glasstual.xcresult
            build/e2e-fixtures
          if-no-files-found: ignore

      - name: Clean up signing material
        if: ${{ always() }}
        run: bash scripts/ci-signing.sh remove
