name: Signed Release

# Manual only. Building a signed, notarised release costs a notarisation round
# trip and touches Apple's servers, so it never runs on push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string used to name the artifact (e.g. 1.0.0). Defaults to the short version in Info.plist.'
        required: false
        type: string
      notarize:
        description: 'Submit to Apple for notarisation and staple the ticket'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Publish a draft GitHub Release with the zip attached'
        required: false
        default: false
        type: boolean
      xcode_version:
        description: 'Xcode version to select on the runner'
        required: false
        default: '26'
        type: string

permissions:
  contents: write

jobs:
  release:
    # Glasstual targets macOS 26 and needs Xcode 26, so the runner image has to
    # be new enough to carry it.
    runs-on: macos-26
    timeout-minutes: 90

    env:
      SCHEME: Glasstual (Standard Release)
      CONFIGURATION: Standard Release
      WORKSPACE: Glasstual.xcworkspace

    steps:
      - name: Check out, including framework submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode ${{ inputs.xcode_version }}
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app" \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # The certificate lives in a throwaway keychain so that nothing is left
      # behind on the runner and so codesign is never prompted for access.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12}" ]; then
            echo "::error::DEVELOPER_ID_APPLICATION_CERT_P12 is not set. See CI-SETUP.md."
            exit 1
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/glasstual-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo -n "${CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/certificate.p12"

          # Without this codesign blocks on a UI prompt that can never be answered.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" > /dev/null

          # Keep the login keychain in the search list so system roots still resolve.
          security list-keychain -d user -s "${KEYCHAIN_PATH}" login.keychain-db

          echo "Signing identities available:"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
               | grep -q "Developer ID Application"; then
            echo "::error::No 'Developer ID Application' identity in the imported .p12. See CI-SETUP.md."
            exit 1
          fi

      - name: Write App Store Connect API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_KEY_P8}" ]; then
            echo "::error::NOTARY_KEY_P8 is not set. See CI-SETUP.md."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/private_keys"
          KEY_PATH="${RUNNER_TEMP}/private_keys/AuthKey.p8"
          echo -n "${NOTARY_KEY_P8}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          echo "ASC_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build

          # The repository's xcconfig signs with "Apple Development" so that a
          # plain checkout builds for whoever cloned it. A distributable build
          # needs the Developer ID identity instead, overridden here rather than
          # in the file so local builds keep working.
          #
          # -allowProvisioningUpdates lets Xcode fetch the Developer ID profile
          # this app needs for its App Group and sandbox entitlements.
          xcodebuild archive \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -archivePath "build/Glasstual.xcarchive" \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${{ secrets.NOTARY_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.NOTARY_ISSUER_ID }}"

      - name: Export signed app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Generated rather than reusing Configurations/ExportArchiveConfiguration.plist
          # so the team ID always comes from the secret and cannot drift.
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "build/Glasstual.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist "build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${{ secrets.NOTARY_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.NOTARY_ISSUER_ID }}"

          ls -la build/export

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          APP="build/export/Glasstual.app"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist" 2>/dev/null || echo '0.0.0')"
          VERSION="${{ inputs.version }}"
          if [ -z "${VERSION}" ]; then VERSION="${PLIST_VERSION}"; fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION}"

      - name: Verify signature
        run: |
          set -euo pipefail
          APP="build/export/Glasstual.app"
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign --display --verbose=4 "${APP}" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier' || true

      - name: Notarize and staple
        if: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          APP="build/export/Glasstual.app"
          SUBMIT_ZIP="build/Glasstual-notarize.zip"

          # ditto preserves the bundle structure notarytool expects.
          /usr/bin/ditto -c -k --keepParent "${APP}" "${SUBMIT_ZIP}"

          xcrun notarytool submit "${SUBMIT_ZIP}" \
            --key "${ASC_KEY_PATH}" \
            --key-id "${{ secrets.NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.NOTARY_ISSUER_ID }}" \
            --wait --timeout 45m

          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"

          # Gatekeeper's own verdict, which is what a user's Mac will apply.
          spctl --assess --type execute --verbose=4 "${APP}"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          OUT="build/Glasstual-${VERSION}.zip"
          /usr/bin/ditto -c -k --keepParent "build/export/Glasstual.app" "${OUT}"
          echo "path=${OUT}" >> "${GITHUB_OUTPUT}"
          echo "name=Glasstual-${VERSION}.zip" >> "${GITHUB_OUTPUT}"
          shasum -a 256 "${OUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "${{ steps.package.outputs.path }}" \
            --draft \
            --title "Glasstual ${VERSION}" \
            --notes "Signed${{ inputs.notarize && ', notarised' || '' }} build of Glasstual ${VERSION}."

      # Runs even when an earlier step failed, so a failed build never leaves a
      # keychain holding the signing key on the runner.
      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/private_keys" 2>/dev/null || true
