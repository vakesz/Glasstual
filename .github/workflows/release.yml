name: Signed Release

# Manual Developer ID distribution outside the Mac App Store.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT: Glasstual.xcodeproj
      SCHEME: Glasstual
      CONFIGURATION: Release
      TEAM_ID: H8W5DK3FN2
      ARCHIVE_PATH: build/Glasstual.xcarchive

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -q '^Xcode 27'

      - name: Resolve build version from git
        run: |
          set -euo pipefail
          ./Scripts/UpdateVersion.sh
          cat Configurations/Version.generated.xcconfig

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12}" ] || [ -z "${CERT_PASSWORD}" ]; then
            echo "::error::Developer ID certificate secrets are not set."
            exit 1
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/glasstual-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo -n "${CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" > /dev/null
          security list-keychain -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | grep -q 'Developer ID Application'

      - name: Install Developer ID provisioning profiles
        run: |
          set -euo pipefail
          PROFILE_SOURCE_DIR="${RUNNER_TEMP}/glasstual-profiles"
          PROFILE_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${PROFILE_SOURCE_DIR}" "${PROFILE_DIR}"
          echo "PROFILE_DIR=${PROFILE_DIR}" >> "${GITHUB_ENV}"

          tar -xzf .github/signing/DeveloperIDProfiles.tar.gz \
            -C "${PROFILE_SOURCE_DIR}"

          install_profile() {
            local filename="$1"
            local uuid="$2"
            local source="${PROFILE_SOURCE_DIR}/${filename}"
            local destination="${PROFILE_DIR}/${uuid}.mobileprovision"
            local actual_uuid

            actual_uuid="$(security cms -D -i "${source}" \
              | plutil -extract UUID raw -o - -)"
            if [ "${actual_uuid}" != "${uuid}" ]; then
              echo "::error::Unexpected UUID in ${filename}."
              exit 1
            fi
            cp "${source}" "${destination}"
          }

          install_profile Glasstual_Developer_ID.provisionprofile \
            1e065476-c63a-4093-b027-e12cdbc03a56
          install_profile Glasstual_IRC_Connection_Host_Developer_ID.provisionprofile \
            efad779e-5dc8-46fb-8466-d4c5a78b5591
          install_profile Glasstual_Scrollback_History_Manager_Developer_ID.provisionprofile \
            b3add7fc-e480-44e8-bf4c-0d8eba1b3f30
          install_profile Glasstual_Inline_Content_Loader_Developer_ID.provisionprofile \
            2d6ca9d2-5daa-4892-ac28-762509236350
          install_profile Glasstual_Inline_Content_Loader_Core_Media_Develop.provisionprofile \
            5293a089-8dff-44f7-9f23-9d1ad75fe7fd

      - name: Build signed archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -archivePath "${ARCHIVE_PATH}" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            GLASSTUAL_MAIN_PROVISIONING_PROFILE="Glasstual Developer ID" \
            GLASSTUAL_IRC_PROVISIONING_PROFILE="Glasstual IRC Connection Host Developer ID" \
            GLASSTUAL_SCROLLBACK_PROVISIONING_PROFILE="Glasstual Scrollback History Manager Developer ID" \
            GLASSTUAL_INLINE_CONTENT_PROVISIONING_PROFILE="Glasstual Inline Content Loader Developer ID" \
            GLASSTUAL_CORE_MEDIA_PROVISIONING_PROFILE="Glasstual Inline Content Loader Core Media Develop"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          APP="${ARCHIVE_PATH}/Products/Applications/Glasstual.app"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "${APP}/Contents/Info.plist")"
          echo "version=${PLIST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify Developer ID signature
        run: |
          set -euo pipefail
          APP="${ARCHIVE_PATH}/Products/Applications/Glasstual.app"
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign --display --verbose=4 "${APP}" 2>&1 \
            | grep -E 'Authority|TeamIdentifier|Identifier'

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_KEY_P8}" ]; then
            echo "::error::NOTARY_KEY_P8 is not set."
            exit 1
          fi

          APP="${ARCHIVE_PATH}/Products/Applications/Glasstual.app"
          KEY_DIR="${RUNNER_TEMP}/private_keys"
          KEY_PATH="${KEY_DIR}/AuthKey.p8"
          SUBMIT_ZIP="build/Glasstual-notarize.zip"
          mkdir -p "${KEY_DIR}"
          echo -n "${NOTARY_KEY_P8}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"

          ditto -c -k --keepParent "${APP}" "${SUBMIT_ZIP}"
          xcrun notarytool submit "${SUBMIT_ZIP}" \
            --key "${KEY_PATH}" \
            --key-id "${{ secrets.NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.NOTARY_ISSUER_ID }}" \
            --wait --timeout 45m
          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"
          spctl --assess --type execute --verbose=4 "${APP}"

      - name: Create release ZIP
        id: package
        run: |
          set -euo pipefail
          APP="${ARCHIVE_PATH}/Products/Applications/Glasstual.app"
          VERSION="${{ steps.version.outputs.version }}"
          OUT="build/Glasstual-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${OUT}"
          echo "path=${OUT}" >> "${GITHUB_OUTPUT}"
          echo "name=Glasstual-${VERSION}.zip" >> "${GITHUB_OUTPUT}"
          shasum -a 256 "${OUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "${{ steps.package.outputs.path }}#${{ steps.package.outputs.name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Glasstual ${VERSION}" \
            --notes "Signed and notarized macOS release."

      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true
          rm -rf \
            "${RUNNER_TEMP}/private_keys" \
            "${RUNNER_TEMP}/glasstual-profiles" \
            2>/dev/null || true
          if [ -n "${PROFILE_DIR:-}" ]; then
            rm -f \
              "${PROFILE_DIR}/1e065476-c63a-4093-b027-e12cdbc03a56.mobileprovision" \
              "${PROFILE_DIR}/efad779e-5dc8-46fb-8466-d4c5a78b5591.mobileprovision" \
              "${PROFILE_DIR}/b3add7fc-e480-44e8-bf4c-0d8eba1b3f30.mobileprovision" \
              "${PROFILE_DIR}/2d6ca9d2-5daa-4892-ac28-762509236350.mobileprovision" \
              "${PROFILE_DIR}/5293a089-8dff-44f7-9f23-9d1ad75fe7fd.mobileprovision" \
              2>/dev/null || true
          fi
